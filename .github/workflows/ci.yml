name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The streaming engine needs this NDK; installing it up front keeps the Gradle step simple.
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      # Play from anywhere: the Rust tunnel (rust/pocketdeck-tunnel-jni) builds on Pocket-Deck-PC's
      # crates/remote, which it expects in a sibling checkout.
      - name: Set up the tunnel build
        run: |
          (cd rust && rustup toolchain install)
          cargo install cargo-ndk --locked
          git clone --depth 1 https://github.com/Pocket-Deck-App/Pocket-Deck-PC "$GITHUB_WORKSPACE/../Pocket-Deck-PC"

      - name: Build and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PocketDeck-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
