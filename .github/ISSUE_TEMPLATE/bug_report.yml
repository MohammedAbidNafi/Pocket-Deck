name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first. For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library / home / collections
        - ROMs and emulators
        - Android games
        - PC streaming
        - Controller / navigation
        - Widget, tile or shortcut
        - Setup / settings
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PocketDeck version
      description: Settings → About.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 10, Android 17"
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller (if relevant)
      placeholder: "Xbox Wireless Controller over Bluetooth"
  - type: textarea
    id: streaming
    attributes:
      label: PC streaming details (if relevant)
      description: Sunshine version, PC OS, how the PC is connected, and anything from Sunshine's log.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: For crashes, `adb logcat` output around the crash helps a lot.
      render: text
